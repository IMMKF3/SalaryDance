plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.salarydance.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.salarydance.app"
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName "1.3.0"
    }

    // 签名密钥通过 android/keystore.properties 提供（不入库）；缺失时 release 回退为未签名
    signingConfigs {
        release {
            def ksFile = rootProject.file("keystore.properties")
            if (ksFile.exists()) {
                def p = new Properties()
                ksFile.withInputStream { p.load(it) }
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            def ksFile = rootProject.file("keystore.properties")
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// 零第三方依赖：仅 Kotlin 标准库，JSON 用系统内置 org.json
dependencies {}
